# Limine — monochrome Nothing OS–style theme (matching the Quickshell shell).
# Template for /boot/limine.conf (install.sh fills in this machine's @MACHINE_ID@ and @ROOT_PARTUUID@) (at the root of the EFI partition: that is where limine-snapper-sync looks for it). Docs: /usr/share/doc/limine/CONFIG.md
timeout: 30

# Background: grey dot grid with a rounded black box and a red dot (limine-nothing.png,
# made for 2880x1800), with no logo or machine name. The box starts 72 px from the edge; the text, at 132.
interface_resolution: 2880x1800
wallpaper: boot():/EFI/BOOT/limine-nothing.png
wallpaper_style: stretched
backdrop: 000000
term_background: ff000000
term_margin: 132
term_margin_gradient: 0

# No branding text at the top (empty). Colors: white and greys; red for errors and the help keys (like Theme.qml)
interface_branding:
interface_branding_colour: ffffff
interface_help_colour: d71921
interface_help_colour_bright: ffffff
term_foreground: ffffff
term_foreground_bright: ffffff
term_background_bright: 2e2e2e
term_palette: 000000;d71921;ffffff;b0b0b0;6e6e6e;b0b0b0;ffffff;b0b0b0
term_palette_bright: 6e6e6e;d71921;ffffff;ffffff;b0b0b0;ffffff;ffffff;ffffff

default_entry: Arch Linux/linux

# limine-snapper-sync's format: the OS is a group ("/+" = expanded), with the
# UKI as "//linux" and "//Snapshots", where the tool adds one entry per
# snapshot (it replaces rootflags=subvol=/@ with the snapshot's path).
# NOTE: limine-snapper-sync rewrites this file in /boot; this copy is the template.
/+Arch Linux
comment: machine-id=@MACHINE_ID@

    //linux
    protocol: efi
    path: boot():/EFI/Linux/arch-linux.efi
    cmdline: root=PARTUUID=@ROOT_PARTUUID@ rootflags=subvol=/@ zswap.enabled=0 rw rootfstype=btrfs quiet splash loglevel=3 rd.udev.log_level=3 udev.log_level=3 systemd.show_status=false rd.systemd.show_status=false vt.global_cursor_default=0 plymouth.enable=0

    //Snapshots

# Windows on its own EFI partition: uncomment and set its PARTUUID (lsblk -o NAME,PARTUUID,LABEL)
# /Windows
#     protocol: efi
#     path: guid(WINDOWS-EFI-PARTUUID):/EFI/Microsoft/Boot/bootmgfw.efi
