# DISABLED (plymouth.enable=0 on the kernel line): it left the NVIDIA monitor without a
# picture (docs/SYSTEM.md). Kept in case it is tried again.
# Plymouth: theme «nothing» (/usr/share/plymouth/themes/nothing). After changing it, sudo mkinitcpio -P
[Daemon]
Theme=nothing
ShowDelay=0
DeviceTimeout=8
# No automatic HiDPI scaling: at 2880×1800 Plymouth doubles images and the
# logo came out twice as big as the UKI's (which systemd-stub draws at actual size)
DeviceScale=1
