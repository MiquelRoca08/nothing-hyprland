# ROG Zephyrus G14 GA403UM (ALC285 codec, SSID 1043:1044): kernel 7.2 lacks its quirk
# (added in August 2026). g14-audio.fw applies the GA403U's (1043:1b13): headset
# microphone on the 3.5 mm jack and a second pair of speakers with volume.
# The file only applies to the Realtek codec; it does nothing on the HDMI cards.
# Delete once the kernel includes the quirk (check dmesg: "ASUS GA403UM").
options snd-hda-intel patch=g14-audio.fw,g14-audio.fw,g14-audio.fw
