# Autologin into Hyprland (uwsm); the shell's lock screen locks right after startup
# (~/.config/hypr/conf/autostart.lua). autologin-session only starts it if that config is in place:
# otherwise (the dotfiles folder deleted) it exits and greetd asks for the password
# (default_session). After logging out: text login. install.sh fills in @USER@.
[terminal]
vt = 1

[initial_session]
command = "/usr/local/bin/autologin-session"
user = "@USER@"

[default_session]
command = "agreety --cmd 'uwsm start -e -D Hyprland hyprland.desktop'"
user = "greeter"
