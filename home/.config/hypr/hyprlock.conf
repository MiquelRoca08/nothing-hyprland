# Lock screen (monochrome, Nothing style; fallback only) — https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
general {
    hide_cursor = true
}

background {
    monitor =
    color = rgba(000000ff)
}

label {
    monitor =
    text = $TIME
    font_size = 110
    font_family = Doto Black
    color = rgba(ffffffff)
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %-d %B" | tr '[:lower:]' '[:upper:]'
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    color = rgba(6e6e6eff)
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 48
    outline_thickness = 1
    outer_color = rgba(2e2e2eff)
    inner_color = rgba(000000ff)
    font_color = rgba(ffffffff)
    check_color = rgba(ffffffff)
    fail_color = rgba(d71921ff)
    placeholder_text = PASSWORD
    fade_on_empty = false
    rounding = 24
    position = 0, -60
    halign = center
    valign = center
}
